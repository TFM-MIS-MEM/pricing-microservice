version: "3.8"

services:
  mongodb:
    restart: unless-stopped
    image: mongo:latest
    container_name: template-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - template-network
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  template:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    container_name: template-service
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - NODE_ENV=production
      - PORT=${PORT}
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      - mongodb
    networks:
      - template-network
    # SIN `ports`. El servicio confía en las cabeceras de identidad que escribe
    # la pasarela (#65), así que publicarlo permitiría a cualquiera saltársela y
    # declararse la cuenta que quisiera. Sólo se alcanza desde la red del
    # despliegue; en Kubernetes, como ClusterIP.

volumes:
  mongo-data:

networks:
  template-network:
    driver: bridge
