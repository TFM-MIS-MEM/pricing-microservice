name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Audit & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 22, la misma versión sobre la que construyen los Dockerfile.
        node-version: [22]

    steps:
      # -----------------------------------------------
      # 1. Checkout code
      # -----------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # -----------------------------------------------
      # 2. Setup pnpm
      # -----------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # La misma que fijan los Dockerfile y la que escribió el lockfile.
          version: 11.24.0

      # -----------------------------------------------
      # 3. Setup Node.js
      # -----------------------------------------------
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      # -----------------------------------------------
      # 4. Install dependencies
      # -----------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # -----------------------------------------------
      # 5. Lint
      # -----------------------------------------------
      - name: Run ESLint
        run: pnpm run lint

      # -----------------------------------------------
      # 6. Security audit
      # -----------------------------------------------
      # `--prod`: audita el árbol que se despliega. Los 23 avisos abiertos son
      # todos de `axios@0.21.4`, alcanzable sólo por
      # `jest-openapi > openapi-validator > axios`, que además NO lo carga: la
      # única mención en el paquete compilado es un `import type` en un `.d.ts`.
      # Es una dependencia fantasma de una herramienta de test. Forzar su
      # resolución con `overrides` silenciaría al escáner sin cambiar nada de lo
      # que se ejecuta, e `ignoreGhsas` sería deuda nueva por cada aviso futuro
      # de axios. `pnpm audit --prod` sobre el árbol de producción: sin avisos.
      - name: Security audit
        run: pnpm audit --prod

      # -----------------------------------------------
      # 7. Tests + Coverage
      # -----------------------------------------------
      - name: Run tests with coverage
        run: pnpm run test:coverage

      # -----------------------------------------------
      # 7. Upload coverage artifact (optional)
      # -----------------------------------------------
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
